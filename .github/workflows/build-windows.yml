name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Portable app: folder with TuneDesk.exe, no installer tools needed.
      - name: Build portable app
        run: gradle createDistributable --no-daemon

      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path build/compose/binaries/main/app/TuneDesk -DestinationPath TuneDesk-windows-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TuneDesk-windows-portable
          path: TuneDesk-windows-portable.zip

      # Optional installer (.exe / .msi); doesn't fail the build if it can't be made.
      - name: Build installer
        continue-on-error: true
        run: gradle packageExe packageMsi --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TuneDesk-windows-installer
          path: build/compose/binaries/main/*/*
          if-no-files-found: ignore
